services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: servicedesk
      POSTGRES_PASSWORD: local-only-password
      POSTGRES_DB: tickets
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicedesk -d tickets"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ticket-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: src/TicketApi/TicketApi.csproj
    command: ["TicketApi.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Tickets: Host=postgres;Port=5432;Database=tickets;Username=servicedesk;Password=local-only-password
      Services__Routing: http://routing-service:8080
      Services__Notifications: http://notification-service:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      routing-service:
        condition: service_started
      notification-service:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: unless-stopped

  routing-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: src/RoutingService/RoutingService.csproj
    command: ["RoutingService.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      otel-collector:
        condition: service_started
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: src/NotificationService/NotificationService.csproj
    command: ["NotificationService.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Notifications: Host=postgres;Port=5432;Database=notifications;Username=servicedesk;Password=local-only-password
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:8889:8889"
    depends_on:
      - jaeger
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - otel-collector
    restart: unless-stopped

volumes:
  postgres-data:
